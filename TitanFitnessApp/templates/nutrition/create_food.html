<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titan - {% if is_edit %}Edit Food{% else %}Add Food{% endif %}</title>
    <style>
        .errorlist {
            color: #d9534f;
            list-style-type: none;
            padding: 0;
            margin: 5px 0;
            font-size: 14px;
            font-weight: bold;
        }
        p {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h2>{% if is_edit %}Edit Food{% else %}Add New Food Item{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if is_edit %}Save Changes{% else %}Save Food{% endif %}</button>
    </form>
    <p>
        {% if is_edit %}
        <a href="{% url 'saved_foods' %}"><button type="button">Cancel</button></a>
        {% else %}
        Want to go back? <a href="{% url 'nutrition' %}"><button type="button">Back to menu</button></a>.
        {% endif %}
    </p>
</body>
</html>
