<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titan - Add Food</title>
    <style>
        .errorlist {
            color: #d9534f;
            list-style-type: none;
            padding: 0;
            margin: 5px 0;
            font-size: 14px;
            font-weight: bold;
        }
        p {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h2>Add New Food item in Titan</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Food</button>
    </form>
    <p>Want to go back?<a href="nutrition.html"> Back to menu</a>.</p>
</body>
</html>
