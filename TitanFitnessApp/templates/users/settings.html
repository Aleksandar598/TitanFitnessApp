{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta charset="UTF-8">
    <title>Titan - Settings</title>
</head>
<body>
<header class="page-header">
    <h1>Settings</h1>
</header>
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save changes</button>
    </form>

    <p><a href="{% url 'dashboard' %}"><button>Back to dashboard</button></a></p>
</body>
</html>
