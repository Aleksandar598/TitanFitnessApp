<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
<h2>Login</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
    <label>
        Username:
        {{ form.username }}
    </label>
</div>
    <div>
        <label>
            Password:
            {{ form.password }}
        </label>
    </div>
    <button type="submit">Log In</button>
</form>

</body>
</html>
