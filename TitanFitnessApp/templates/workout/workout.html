<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titan - Workouts</title>
</head>
<body>
    <h1>Workouts</h1>
    <p>Manage your exercises and workout plans.</p>

    <div>
        <a href="{% url 'exercise_list' %}">Exercises</a>
    </div>

    <div>
        {% if active_session %}
            <a href="{% url 'workout_session_detail' active_session.id %}">
                Resume workout
            </a>
        {% else %}
            <form method="post" action="{% url 'start_workout_session' %}">
                {% csrf_token %}
                <button type="submit">Start workout</button>
            </form>
        {% endif %}
    </div>

    <p><a href="{% url 'dashboard' %}">Back to dashboard</a></p>
</body>
</html>
